# Alarm napięcia sieci - push na vivo Tomka przy zaniku prądu i przy napięciu poza normą.
# Tomasz 22.11.2026: o wyłączeniach prądu w zasadzie nie wie (dom jedzie wtedy z magazynu
# Sofara, NAS ma własny UPS na ok. 50 min), a zeszłej zimy napięcie na fazach potrafiło
# tak odjechać, że urządzenia nie działały.
#
# Źródło: napięcie sieci po stronie falownika, sensor.sofar_logger_voltage_phase_r/s/t
# (Solarman, odczyt co ok. 6 s). Krótkich szpilek poniżej 6 s Sofar i tak nie widzi.
#
# Progi: norma PN-EN 50160 to 230 V ±10%, czyli 207-253 V.
# - alarm: poniżej 207 V albo powyżej 253 V przez 30 s;
# - poniżej 100 V na wszystkich fazach naraz = brak prądu z sieci (jeden push, nie trzy);
# - powrót: 212-248 V przez 2 min (histereza, żeby nie migało przy granicy).
# Push o powrocie idzie tylko wtedy, gdy wcześniej poszedł alarm: pamiętają to helpery
# input_boolean.napiecie_alarm_l1/l2/l3 (tworzone przez UI/WebSocket, nie YAML).
#
# Zanik sieci ma osobny, pewniejszy alarm siec_eps (stan falownika „Emergency power supply”,
# push na oba telefony). Gdy falownik jest już na zasilaniu awaryjnym, ten alarm nie wysyła
# własnego „Brak prądu z sieci” ani „Prąd z sieci wrócił”; robi to tylko wtedy, gdy napięcie
# zniknęło, a falownik stanu awaryjnego nie zgłosił (flaga input_boolean.napiecie_brak_pradu_push).
# Wysyłka przez script.powiadomienie: wpis w dzienniku HA i klik otwiera /lovelace/powiadomienia.
#
# Wdrożenie: POST /api/config/automation/config/napiecie_alarm (treść jako JSON).
id: napiecie_alarm
alias: "Napięcie sieci - zanik prądu i napięcie poza normą"
description: >-
  Push na vivo Tomka, gdy na fazie L1/L2/L3 napięcie jest poza 207-253 V przez 30 s
  albo zniknie na wszystkich fazach (brak prądu z sieci), oraz gdy wróci do normy.
mode: queued
max: 10
triggers:
  - trigger: numeric_state
    entity_id: &fazy
      - sensor.sofar_logger_voltage_phase_r
      - sensor.sofar_logger_voltage_phase_s
      - sensor.sofar_logger_voltage_phase_t
    below: 207
    for:
      seconds: 30
    id: problem
  - trigger: numeric_state
    entity_id: *fazy
    above: 253
    for:
      seconds: 30
    id: problem
  - trigger: numeric_state
    entity_id: *fazy
    above: 212
    below: 248
    for:
      minutes: 2
    id: norma
variables:
  encje:
    - sensor.sofar_logger_voltage_phase_r
    - sensor.sofar_logger_voltage_phase_s
    - sensor.sofar_logger_voltage_phase_t
  faza: >-
    {{ {'sensor.sofar_logger_voltage_phase_r': 'L1',
        'sensor.sofar_logger_voltage_phase_s': 'L2',
        'sensor.sofar_logger_voltage_phase_t': 'L3'}[trigger.entity_id] }}
  # Co jest na której fazie - wg „wypis_obwodow_rozdzielnica.xlsx” (Google Drive Tomasza,
  # odczyt 22.11.2026). Obowiązuje kolumna „Faza”: komentarze „było Lx; podpięto do ... do L2”
  # to dawne przełączenia z elektrykami, które Tomasz cofnął (22.11.2026).
  # Obwód 19 to już tylko mikrofala; nowy piekarnik jest na L1 gniazda płyty indukcyjnej
  # (obwód 42, Tomasz sprawdził 22.11.2026 czujnikiem sensor.pobor_fazy_l1).
  # Pompy ciepła: 28 DUŻA na L2, 29 MAŁA na L3 (opis z rozdzielnicy).
  # L1/L2/L3 z rozdzielnicy = R/S/T w Sofarze - potwierdzone pomiarem 22.11.2026
  # (sensor.pobor_fazy_lx): bojler (27, L1) podbił L1, wyłączenie dużej pompy (28, L2) zbiło L2,
  # a wyłączenie małej pompy (29, L3) zbiło L3.
  odbiorniki: >-
    {{ {'L1': 'bojler, nowy piekarnik, suszarka, zmywarka, gniazdka w pokojach, oświetlenie zewnętrzne, domofon',
        'L2': 'duża pompa ciepła, rekuperacja, lodówka z okapem, mikrofala, pralka w dużej łazience, łazienka, strych, część oświetlenia parteru',
        'L3': 'mała pompa ciepła, pralka w pomieszczeniu technicznym, kuchnia nad blatem, jadalnia, salon TV, multimedia, sypialnia, korytarz z małą łazienką, część oświetlenia parteru'}[faza] }}
  flaga: "input_boolean.napiecie_alarm_{{ faza | lower }}"
  flagi:
    - input_boolean.napiecie_alarm_l1
    - input_boolean.napiecie_alarm_l2
    - input_boolean.napiecie_alarm_l3
  v: "{{ trigger.to_state.state | float(0) | round(0) | int }}"
  napiecia: "{{ encje | map('states') | map('float', 0) | list }}"
  brak_pradu: "{{ napiecia | max < 100 }}"
  wszystkie_ok: "{{ napiecia | min >= 212 and napiecia | max <= 248 }}"
  opis: >-
    L1 {{ napiecia[0] | round(0) | int }} V, L2 {{ napiecia[1] | round(0) | int }} V,
    L3 {{ napiecia[2] | round(0) | int }} V
  soc: "{{ states('sensor.sofar_logger_battery') }}"
actions:
  - choose:
      # Pierwszy alarm na tej fazie (kolejne trzyma flaga, dopóki napięcie nie wróci).
      - conditions:
          - condition: trigger
            id: problem
          - condition: template
            value_template: "{{ is_state(flaga, 'off') }}"
        sequence:
          # Falownik na zasilaniu awaryjnym = zanik sieci, który zgłasza siec_eps. Milczymy
          # i zapalamy wszystkie flagi, żeby powrót też nie poszedł. 22.11.2026 realny zanik
          # trwał ~34 s: po 30 s napięcie wracało (148 V), więc warunek „wszystkie < 100 V”
          # nie zachodził i poszły trzy zbędne pushe „Brak napięcia na fazie”.
          - if:
              - condition: template
                value_template: >-
                  {{ is_state('sensor.sofar_logger_inverter_status', 'Emergency power supply')
                     or is_state('input_boolean.brak_sieci', 'on') }}
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: "{{ flagi }}"
              - stop: "Zanik sieci - zgłasza siec_eps"
          - if:
              - condition: template
                value_template: "{{ brak_pradu }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: "{{ flagi }}"
              # Zanik sieci zgłasza siec_eps; tu tylko zapas na wypadek, gdyby falownik
              # nie przeszedł w stan zasilania awaryjnego.
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state('sensor.sofar_logger_inverter_status', 'Emergency power supply') }}
                then:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.napiecie_brak_pradu_push
                  - action: script.powiadomienie
                    data:
                      tytul: "Brak prądu z sieci"
                      tresc: >-
                        Napięcie zniknęło na wszystkich fazach ({{ opis }}).
                        Dom działa z magazynu, SOC {{ soc }}%.
                      odbiorcy: &odbiorcy
                        - mobile_app_tomek_vivo_x300_pro
                      tag: napiecie
                      kanal: Napięcie sieci
                      ikona: mdi:transmission-tower-off
            else:
              - action: input_boolean.turn_on
                target:
                  entity_id: "{{ flaga }}"
              - action: script.powiadomienie
                data:
                  tytul: >-
                    {% if v < 100 %}Brak napięcia na fazie {{ faza }}
                    {% elif v < 207 %}Za niskie napięcie na fazie {{ faza }}
                    {% else %}Za wysokie napięcie na fazie {{ faza }}{% endif %}
                  tresc: >-
                    {{ faza }}: {{ v }} V od 30 s (norma 207-253 V).
                    Na {{ faza }}: {{ odbiorniki }}. Na wszystkich fazach: płyta indukcyjna i ładowarka auta.
                    Teraz: {{ opis }}.
                  odbiorcy: *odbiorcy
                  tag: napiecie
                  kanal: Napięcie sieci
                  ikona: mdi:transmission-tower-off
      # Powrót do normy - tylko gdy wcześniej poszedł alarm.
      - conditions:
          - condition: trigger
            id: norma
          - condition: template
            value_template: "{{ is_state(flaga, 'on') }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ wszystkie_ok }}"
            then:
              - variables:
                  bylo_wszystkie: "{{ flagi | select('is_state', 'on') | list | count == 3 }}"
                  byl_push_braku: "{{ is_state('input_boolean.napiecie_brak_pradu_push', 'on') }}"
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ flagi + ['input_boolean.napiecie_brak_pradu_push'] }}"
              # Po zaniku sieci zgłoszonym przez siec_eps powrót też ogłasza siec_eps.
              - if:
                  - condition: template
                    value_template: "{{ not bylo_wszystkie or byl_push_braku }}"
                then:
                  - action: script.powiadomienie
                    data:
                      tytul: >-
                        {% if bylo_wszystkie %}Prąd z sieci wrócił{% else %}Napięcie wróciło do normy{% endif %}
                      tresc: "Wszystkie fazy w normie od 2 min: {{ opis }}."
                      odbiorcy: *odbiorcy
                      tag: napiecie
                      kanal: Napięcie sieci
                      ikona: mdi:transmission-tower
            else:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ flaga }}"
              - action: script.powiadomienie
                data:
                  tytul: "Faza {{ faza }} wróciła do normy"
                  tresc: "{{ faza }}: {{ v }} V ({{ odbiorniki }}). Teraz: {{ opis }}."
                  odbiorcy: *odbiorcy
                  tag: napiecie
                  kanal: Napięcie sieci
                  ikona: mdi:transmission-tower
