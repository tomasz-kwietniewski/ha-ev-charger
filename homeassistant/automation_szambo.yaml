# Alarm szamba - push na telefon Tomka, niezależny od aplikacji Aquilo.
# Dane: sensor.szambo (REST z odbiornika Aquilo w LAN, configuration.yaml).
#
# Liczymy centymetry, nie prognozę Aquilo (daysLeft): odbiornik wyznacza dzień
# wybrania za wcześnie, a przy dużym zużyciu przybywa kilka cm na dobę, więc
# 3 cm do pełna to sygnał "napisz dziś SMS, szambiarz przyjedzie jutro" (Tomasz 03.11.2026).
# lvlToFull: cm do stanu pełnego, poniżej zera = ponad stan pełny.
#
# Wdrożenie: przez API konfiguracji automatyzacji (to samo, co zapis z UI):
#   POST /api/config/automation/config/szambo_alarm  (treść tego pliku jako JSON)
# Automatyzacja trafia wtedy do /config/automations.yaml i od razu jest przeładowana.
id: szambo_alarm
alias: "Szambo - czas wezwać szambiarza"
description: >-
  Gdy do pełna zostały 3 cm, push "zamów szambiarza na jutro"; gdy szambo pełne
  (0 cm), push "wezwij dziś". Źródło: odbiornik Aquilo w LAN, bez chmury.
# queued: przy skoku na 0 cm oba wyzwalacze przychodzą naraz, drugi bieg nie może przepaść
mode: queued
triggers:
  - trigger: numeric_state
    entity_id: sensor.szambo
    attribute: lvlToFull
    below: 3.01
    id: prognoza
  - trigger: numeric_state
    entity_id: sensor.szambo
    attribute: lvlToFull
    below: 0.01
    id: pelne
conditions:
  # Zanik odczytu REST albo restart HA: atrybut znika i wraca, a numeric_state
  # wyzwala się ponownie. Takie powroty pomijamy (ręczny trigger nie ma from_state).
  - condition: template
    value_template: >-
      {{ trigger.from_state is not defined
         or trigger.from_state.state not in ['unavailable', 'unknown'] }}
actions:
  - variables:
      pct: "{{ state_attr('sensor.szambo', 'pct') | int(0) }}"
      cm: "{{ state_attr('sensor.szambo', 'lvlToFull') | float(0) }}"
      # Pełna data: samo "12.10" HA zamienia w zmiennej na liczbę 12.1
      oproznione: >-
        {% set t = as_timestamp(state_attr('sensor.szambo', 'lstEmpty'), none) %}
        {{ t | timestamp_custom('%d.%m.%Y') if t else 'brak danych' }}
  - choose:
      # Przy skoku z 4 cm od razu na 0 oba wyzwalacze odpalą się razem -
      # wtedy wystarczy alarm "pełne".
      - conditions:
          - condition: trigger
            id: prognoza
          - condition: template
            value_template: "{{ cm > 0 }}"
        sequence:
          - action: notify.mobile_app_tomek_vivo_x300_pro
            data:
              title: "Szambo: do pełna {{ cm | round(0) | int }} cm"
              message: >-
                Zapełnienie {{ pct }}%. Napisz dziś do szambiarza, żeby przyjechał jutro.
                Ostatnie opróżnienie: {{ oproznione }}.
              data: &push
                tag: szambo
                channel: Szambo
                importance: high
                priority: high
                ttl: 0
                notification_icon: mdi:toilet
      - conditions:
          - condition: template
            value_template: "{{ trigger.id | default('') != 'prognoza' }}"
        sequence:
          - action: notify.mobile_app_tomek_vivo_x300_pro
            data:
              title: "Szambo pełne ({{ pct }}%)"
              message: >-
                {% if cm < 0 %}Już {{ (-cm) | round(0) | int }} cm ponad stan pełny. {% endif %}Czas wezwać szambiarza, najlepiej dziś.
                Ostatnie opróżnienie: {{ oproznione }}.
              data: *push
