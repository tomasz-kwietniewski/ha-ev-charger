# Ładuje domyślny zestaw integracji Home Assistant. Nie usuwaj tej linii!
default_config:

# Sekcja motywów do frontendu. Motywy ładowane z katalogu 'themes'.
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Konfiguracja http (use_x_forwarded_for, trusted_proxies) przeniesiona do UI:
# Ustawienia > System > Sieć > HTTP server. YAML wycofany w HA 2026.8, przestaje działać w 2027.2.0.

# Zachowaj historię ważnych sensorów przez 10 lat (Tomasz 03.11.2026: historia szamba latami).
# Tanie, bo include ogranicza zapis do ok. 30 encji (kilka tys. wierszy na dobę).
recorder:
  purge_keep_days: 3650
  include:
    entities:
      - sensor.zuzycie_domu_miesiac
      - sensor.produkcja_pv_miesiac
      - sensor.import_z_sieci_miesiac
      - sensor.eksport_do_sieci_miesiac
      - sensor.samowystarczalnosc_miesiac
      - sensor.samowystarczalnosc_dzis
      - sensor.sofar_logger_today_production
      - sensor.sofar_logger_today_load_consumption
      - sensor.sofar_logger_today_energy_import
      - sensor.sofar_logger_today_energy_export
      - sensor.sofar_logger_battery
      - sensor.ev_energia_miesiac
      - sensor.ev_energia_lacznie
      - sensor.ev_historia_miesieczna
      - sensor.ev_moc_ladowania
      - sensor.ev_prad_ladowania
      - sensor.ev_energia_sesja
      - sensor.koszt_energii_dzis
      - sensor.realny_koszt_kwh_dzis
      - sensor.miesieczne_saldo_energii
      - sensor.miesieczny_koszt_zakupu
      - sensor.miesieczny_przychod_sprzedazy
      - sensor.energia_pobrana_miesiecznie
      - sensor.energia_sprzedana_miesiecznie
      # Szambo - historia do oceny tempa napełniania
      - sensor.pct
      - sensor.lvl
      - sensor.szambo_cm_do_pelna
      - sensor.szambo   # atrybuty: lstEmpty, lstRead, bat

sensor:
  - platform: rest
    name: szambo
    resource: http://192.168.50.234/state
    value_template: "{{ value_json.sensors[0].id }}"
    json_attributes_path: "$.sensors.0"
    json_attributes:
      - lvl
      - pct
      - lstRead
      - bat
      # Liczone przez odbiornik Aquilo; lvlToFull używa automatyzacja szambo_alarm
      - daysLeft
      - lstEmpty
      - lvlToFull

# Trwała historia szamba (automatyzacja szambo_historia, plik /config/szambo_historia.csv)
shell_command:
  szambo_zapis: "/bin/sh /config/szambo_zapis.sh '{{ linia }}'"

# Podsumowanie historii szamba (wywozy, cykle, koszty) dla karty na dashboardzie
command_line:
  - sensor:
      name: "Szambo historia"
      unique_id: szambo_historia
      command: "python3 /config/szambo_historia.py"
      command_timeout: 30
      scan_interval: 3600
      unit_of_measurement: "wywozów"
      value_template: "{{ value_json.liczba_wywozow }}"
      json_attributes:
        - ostatni_wywoz
        - dni_od_wywozu
        - sredni_cykl_dni
        - najkrotszy_cykl_dni
        - najdluzszy_cykl_dni
        - m3_na_dobe
        - cena_ostatnia_zl
        - prognoza_koszt_rok_zl
        - koszt_wywozow_razem_zl
        - koszt_jednorazowy_razem_zl
        - lata
        - jednorazowe
        - wywozy

logger:
  default: warning
  # logs:
    # custom_components.localtuya: debug

# Utility meter — miesięczne liczniki z Sofara
# Resetują się automatycznie 1. dnia każdego miesiąca
utility_meter:
  zuzycie_domu_miesiac:
    source: sensor.sofar_logger_today_load_consumption
    name: "Zużycie domu miesiąc"
    cycle: monthly
  produkcja_pv_miesiac:
    source: sensor.sofar_logger_today_production
    name: "Produkcja PV miesiąc"
    cycle: monthly
  import_z_sieci_miesiac:
    source: sensor.sofar_logger_today_energy_import
    name: "Import z sieci miesiąc"
    cycle: monthly
  eksport_do_sieci_miesiac:
    source: sensor.sofar_logger_today_energy_export
    name: "Eksport do sieci miesiąc"
    cycle: monthly

template:
  # Sensory szamba (zmigrowane ze starego formatu sensor: platform: template)
  # default_entity_id zachowuje oryginalne entity_id, by nie psuć dashboardu
  - sensor:
      - name: "Poziom"
        default_entity_id: sensor.lvl
        state: "{{ state_attr('sensor.szambo', 'lvl') | float(0) }}"
        availability: "{{ state_attr('sensor.szambo', 'lvl') is number }}"
        unit_of_measurement: "cm"
        device_class: distance
        # state_class = statystyki długoterminowe, których recorder nie kasuje po 365 dniach
        state_class: measurement

      - name: "Procent"
        default_entity_id: sensor.pct
        state: "{{ state_attr('sensor.szambo', 'pct') | float(0) }}"
        availability: "{{ state_attr('sensor.szambo', 'pct') is number }}"
        unit_of_measurement: "%"
        state_class: measurement

      - name: "Bateria"
        default_entity_id: sensor.bat
        state: "{{ state_attr('sensor.szambo', 'bat') | float(0) }}"
        unit_of_measurement: "%"
        device_class: battery

      - name: "Ostatni odczyt (czytelny)"
        default_entity_id: sensor.lstread
        state: >-
          {% set t_string = state_attr('sensor.szambo', 'lstRead') %}
          {% set t = as_timestamp(t_string, none) %}
          {{ t | timestamp_custom('%d %b %H:%M') if t is number else '—' }}

      - name: "Ostatni odczyt"
        default_entity_id: sensor.lstread_ts
        state: "{{ state_attr('sensor.szambo', 'lstRead') }}"
        device_class: timestamp

      - name: "Minuty od odczytu"
        default_entity_id: sensor.mininterval
        unit_of_measurement: "min"
        state: >-
          {% set t_string = state_attr('sensor.szambo', 'lstRead') %}
          {% set t = as_timestamp(t_string, none) %}
          {% if t is number %}
            {{ ((now().timestamp() - t) / 60) | round(0) }}
          {% else %}
            unknown
          {% endif %}

      - name: "Szambo cm do pełna"
        default_entity_id: sensor.szambo_cm_do_pelna
        unit_of_measurement: "cm"
        device_class: distance
        state_class: measurement
        state: "{{ state_attr('sensor.szambo', 'lvlToFull') }}"
        availability: "{{ state_attr('sensor.szambo', 'lvlToFull') is number }}"

      # Prognoza odbiornika - tylko informacyjnie, alarm liczy centymetry
      - name: "Szambo dni do pełna"
        default_entity_id: sensor.szambo_dni_do_pelna
        unit_of_measurement: "d"
        state: "{{ state_attr('sensor.szambo', 'daysLeft') }}"
        availability: "{{ state_attr('sensor.szambo', 'daysLeft') is number }}"

      - name: "Szambo ostatnie opróżnienie"
        default_entity_id: sensor.szambo_ostatnie_oproznienie
        device_class: timestamp
        state: "{{ state_attr('sensor.szambo', 'lstEmpty') }}"
        availability: "{{ state_attr('sensor.szambo', 'lstEmpty') is string }}"

  - sensor:
      - name: "EV Status Opis"
        unique_id: ev_status_opis
        state: >
          {% set s = states('input_text.ev_charger_status') | upper %}
          {% if s == 'WORKING' %}Ladowanie
          {% elif s == 'SLEEP' %}Gotowy (czeka)
          {% elif s == 'IDLE' %}Niepodlaczone
          {% elif s == 'PAUSE' %}Pauza
          {% elif s == 'OFFLINE' %}Offline
          {% else %}Nieznany
          {% endif %}
        icon: >
          {% set s = states('input_text.ev_charger_status') | upper %}
          {% if s == 'WORKING' %}mdi:ev-station
          {% elif s == 'SLEEP' %}mdi:power-plug
          {% elif s == 'IDLE' %}mdi:power-plug-off
          {% else %}mdi:help-circle
          {% endif %}

      - name: "EV Tryb Opis"
        unique_id: ev_tryb_opis
        state: >
          {% set m = states('input_text.ev_charger_mode') | upper %}
          {% if m == 'NEGATIVE_PRICE' %}Ujemna cena - max moc
          {% elif m == 'SOLAR' %}Nadwyzki PV
          {% elif m == 'EMERGENCY' %}Tryb awaryjny - max moc
          {% elif m == 'BATTERY_PRIORITY' %}Priorytet baterii
          {% elif m == 'WINTER_NIGHT' %}Tania strefa G12W (zima)
          {% elif m == 'GRID_LIMIT' %}Wstrzymane - przylacze pelne
          {% elif m == 'CAR_FULL' %}Auto naladowane
          {% elif m == 'MANUAL' %}Ręcznie (Smart Life)
          {% elif m == 'IDLE' %}Oczekiwanie
          {% elif m == 'OFFLINE' %}Ladowarka offline
          {% else %}Nieznany
          {% endif %}
        icon: >
          {% set m = states('input_text.ev_charger_mode') | upper %}
          {% if m == 'NEGATIVE_PRICE' %}mdi:currency-usd-off
          {% elif m == 'SOLAR' %}mdi:solar-power
          {% elif m == 'EMERGENCY' %}mdi:lightning-bolt
          {% elif m == 'BATTERY_PRIORITY' %}mdi:battery-charging
          {% elif m == 'WINTER_NIGHT' %}mdi:weather-night
          {% elif m == 'GRID_LIMIT' %}mdi:transmission-tower-off
          {% elif m == 'CAR_FULL' %}mdi:battery-check
          {% elif m == 'MANUAL' %}mdi:hand-back-right
          {% else %}mdi:car-electric
          {% endif %}

      # Guard: po restarcie HA input_text.ev_data bywa puste/unknown zanim
      # AppDaemon zdazy je zapisac - from_json na takim stanie wywala template.
      - name: "EV Moc Ladowania"
        unique_id: ev_moc_ladowania
        state: >
          {% set d = states('input_text.ev_data') %}
          {% if d and d.startswith('{') %}{{ (((d | from_json).power | default(0)) | float / 1000) | round(2) }}{% else %}0{% endif %}
        unit_of_measurement: "kW"
        icon: mdi:lightning-bolt

      - name: "EV Prad Ladowania"
        unique_id: ev_prad_ladowania
        state: >
          {% set d = states('input_text.ev_data') %}
          {% if d and d.startswith('{') %}{{ (d | from_json).current | default(0) }}{% else %}0{% endif %}
        unit_of_measurement: "A"
        icon: mdi:current-ac

      - name: "EV Energia Sesja"
        unique_id: ev_energia_sesja
        state: >
          {% set d = states('input_text.ev_data') %}
          {% if d and d.startswith('{') %}{{ (d | from_json).session | default(0) }}{% else %}0{% endif %}
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:battery-charging-outline

      - name: "EV Energia Miesiac"
        unique_id: ev_energia_miesiac
        state: >
          {% set d = states('input_text.ev_data') %}
          {% if d and d.startswith('{') %}{{ (d | from_json).month | default(0) }}{% else %}0{% endif %}
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:calendar-month

      - name: "EV Energia Lacznie"
        unique_id: ev_energia_lacznie
        state: >
          {% set d = states('input_text.ev_data') %}
          {% if d and d.startswith('{') %}{{ (d | from_json).total | default(0) }}{% else %}0{% endif %}
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:counter

      # Samowystarczalność dziś (dane z Sofara)
      # = (zużycie domu dziś - pobrano z sieci dziś) / zużycie domu dziś * 100%
      - name: "Samowystarczalnosc Dzis"
        unique_id: samowystarczalnosc_dzis
        state: >
          {% set zuzycie = states('sensor.sofar_logger_today_load_consumption') | float(0) %}
          {% set import = states('sensor.sofar_logger_today_energy_import') | float(0) %}
          {% if zuzycie > 0 %}
            {{ ((zuzycie - import) / zuzycie * 100) | round(1) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "%"
        icon: mdi:home-percent

      # Samowystarczalność miesiąc (dane z Sofara)
      # = (zużycie domu - pobrano z sieci) / zużycie domu * 100%
      - name: "Samowystarczalnosc Miesiac"
        unique_id: samowystarczalnosc_miesiac
        state: >
          {% set zuzycie = states('sensor.zuzycie_domu_miesiac') | float(0) %}
          {% set import = states('sensor.import_z_sieci_miesiac') | float(0) %}
          {% if zuzycie > 0 %}
            {{ ((zuzycie - import) / zuzycie * 100) | round(1) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "%"
        icon: mdi:home-percent